name: Windows export

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fsSL -o "$RUNNER_TEMP/godot/editor.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL -o "$RUNNER_TEMP/godot/templates.tpz" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          mkdir -p "$RUNNER_TEMP/godot/template-archive"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/template-archive"
          cp -a "$RUNNER_TEMP/godot/template-archive/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/editor" -type f -name 'Godot_*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project resources
        run: '"$GODOT_BIN" --headless --editor --path . --import'

      - name: Test deterministic universe generation
        run: '"$GODOT_BIN" --headless --path . -s tests/test_universe.gd'

      - name: Test simulation, actors and loopback visits
        run: |
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_state.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_calendar.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_flight_save.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_calendar_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_actors.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_network.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_pvp_hits.gd
          timeout 40s "$GODOT_BIN" --headless --path . -s tests/test_pvp_transport.gd
          timeout 40s "$GODOT_BIN" --headless --path . -s tests/test_pvp_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_visit.gd -- --capture-only

          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_controls.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_flight_safety.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_ship_collision.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_ship_collision_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_ship_designer.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_anchored_interior.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_coasting_hull.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_coasting_interior.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_interior_glass.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_height_texture_lifetime.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_shipyard_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_flight_impact_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_steam_session.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_faction.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_station_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_station_layout.gd -- --capture-only
          timeout 45s "$GODOT_BIN" --headless --path . -s tests/test_station_construction.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_large_berth.gd -- --capture-only
          timeout 40s "$GODOT_BIN" --headless --path . -s tests/test_public_large_berth.gd -- --capture-only
          timeout 70s "$GODOT_BIN" --headless --path . -s tests/test_station_interior.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_fleet_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_crew.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_recovery.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_ship_layout.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_sector_position.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_flight_frame.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_spatial_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_planet_height_field.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_planet_geology.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_planet_terrain.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_pilot_gravity.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_planet_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_surface_colony.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_colony_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_ground_actor_behavior.gd
          timeout 40s "$GODOT_BIN" --headless --path . -s tests/test_port_staff.gd -- --capture-only
          timeout 40s "$GODOT_BIN" --headless --path . -s tests/test_port_navigation.gd
          timeout 60s "$GODOT_BIN" --headless --path . -s tests/test_guard_navigation.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_cruise_route.gd
          timeout 65s "$GODOT_BIN" --headless --path . -s tests/test_cruise_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_operations_gameplay.gd -- --capture-only

      - name: Test integrated gameplay
        run: 'timeout 30s "$GODOT_BIN" --headless --path . -- --smoke'

      - name: Export Windows build
        run: 'mkdir -p build/windows && "$GODOT_BIN" --headless --path . --export-release "Windows Desktop" build/windows/NeXt.exe'

      - uses: actions/upload-artifact@v4
        with:
          name: NeXt-Windows
          path: build/windows/
          if-no-files-found: error
