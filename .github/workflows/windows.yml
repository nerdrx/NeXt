name: Windows export

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test isolated Proton cleanup
        run: bash tests/test_proton_cleanup.sh

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fsSL -o "$RUNNER_TEMP/godot/editor.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL -o "$RUNNER_TEMP/godot/templates.tpz" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot/editor"
          mkdir -p "$RUNNER_TEMP/godot/template-archive"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/template-archive"
          cp -a "$RUNNER_TEMP/godot/template-archive/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/editor" -type f -name 'Godot_*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project resources
        run: '"$GODOT_BIN" --headless --editor --path . --import'

      - name: Test deterministic universe generation
        run: '"$GODOT_BIN" --headless --path . -s tests/test_universe.gd'

      - name: Test simulation, actors and loopback visits
        run: |
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_state.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_market_inventory.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_calendar.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_flight_save.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_calendar_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_actors.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_network.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_network_clock.gd
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_pvp_hits.gd
          timeout 40s "$GODOT_BIN" --headless --path . -s tests/test_pvp_transport.gd
          timeout 40s "$GODOT_BIN" --headless --path . -s tests/test_pvp_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_visit.gd -- --capture-only

          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_controls.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_flight_safety.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_ship_collision.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_ship_collision_gameplay.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_ship_designer.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_anchored_interior.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_coasting_hull.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_coasting_navigation.gd -- --capture-only
          timeout 30s "$GODOT_BIN" --headless --path . -s tests/test_flight_dynamics.gd
          timeout 35s "$GODOT_BIN" --headless --path . -s tests/test_atmospheric_flight.gd
          timeout 35s "$GODOT_BIN" --headless --path . -s tests/test_atmospheric_drag_gameplay.gd -- --capture-only
          timeout 35s "$GODOT_BIN" --headless --path . -s tests/test_aerodynamic_heat.gd
